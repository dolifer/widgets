name: Release

# All cards ship as one bundle, widgets.js, the file HACS installs. Bump
# "version" in package.json (and each changed card's own version), merge, then:
#   git tag v1.0.1 && git push origin v1.0.1
# The tag must equal package.json. A pre-release version (1.0.0-beta.1) makes
# a draft pre-release, published by hand once it has been tried.
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the notes compare with the previous tag
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Pack
        env:
          TAG: ${{ github.ref_name }}
        run: node tools/release.mjs "$TAG"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)
          {
            cat release/notes.md
            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              git log --format='- %s' "$prev..$TAG" -- widgets
            else
              echo "First release."
            fi
          } > notes.md
          flags=()
          case "${TAG#v}" in *-*) flags=(--prerelease --draft) ;; esac
          gh release create "$TAG" release/widgets.js --title "$TAG" --notes-file notes.md --verify-tag "${flags[@]}"
