name: Power schedule
version: 1.2.3
description: >
  Whether the power is on now and why it is off, and what the outage schedule
  says comes next: an outage or the power coming back, with a countdown.
tag: power-schedule-card
script: power-schedule-card.js
preview:
  width: 420
  language: uk
  languages: [uk, en]
  clock: "18:20"
  options:
    - { key: layout, label: Layout, default: stacked, values: [{ value: stacked, label: Top/bottom }, { value: horizontal, label: Side by side }] }
    - { key: align, label: Align, default: left, values: [left, center, right] }
    - { key: valign, label: Vertical, default: top, values: [top, center, bottom] }
    - { key: show_now_icon, label: Now icon, default: true, values: [true, false] }
    - { key: show_next_icon, label: Next icon, default: true, values: [true, false] }
    - { key: seam_icon, label: Centre, default: arrow, values: [{ value: arrow, label: Arrow }, { value: next, label: Next icon }] }
    - { key: gradient, label: Gradient, default: false, values: [false, true] }
config:
  entity: binary_sensor.grid
  next_outage: sensor.next_outage
  next_restore: sensor.next_restore

# The two halves always agree: while the power is off the top says why
# (scheduled, emergency, unscheduled) and the bottom says when it comes back;
# while it is on the bottom says when the next outage is. `expect` is the text
# the card must show (in the state's language) at that point of the timeline.
states:
  - id: on-outage-next
    title: Power on, outage at 20:00
    description: Move the clock past 20:00 to watch the outage start and the restore countdown take over.
    entities:
      binary_sensor.grid: { state: "on", changed: now-1h04m }
      sensor.next_outage: now+1h40m
      sensor.next_restore: unknown
    expect: [Світло є, вже 1 г 04 хв, Відключення, через 1 г 40 хв, "20:00"]
    timeline:
      - at: now+1h40m
        note: Outage starts
        set:
          binary_sensor.grid: "off"
          sensor.next_outage: unknown
          sensor.next_restore: now+5h40m
        expect: [Немає світла, за графіком, Світло буде, через 4 г 00 хв, "00:00"]
      - at: now+5h40m
        note: Power back on time
        set:
          binary_sensor.grid: "on"
          sensor.next_outage: now+9h40m
          sensor.next_restore: unknown
        expect: [Світло є, Відключення, "04:00", "!за графіком"]

  - id: off-restore-tomorrow
    title: No power, back tomorrow
    description: The restore time is on another day, so the date shows too.
    entities:
      binary_sensor.grid: { state: "off", changed: now-1m }
      sensor.next_outage: unknown
      sensor.next_restore: now+5h40m
    expect: [Немає світла, вже 1 хв, за графіком, Світло буде]
    duration: 7h
    timeline:
      - at: now+5h40m
        note: Power back
        set:
          binary_sensor.grid: "on"
          sensor.next_outage: now+12h
          sensor.next_restore: unknown
        expect: [Світло є, Відключення]

  - id: restore-late
    title: Restore running late
    description: The schedule said 18:00, the power is still off.
    entities:
      binary_sensor.grid: { state: "off", changed: now-3h20m }
      sensor.next_outage: unknown
      sensor.next_restore: now-20m
    expect: [Немає світла, за графіком, Мали увімкнути, запізнюється, "18:00"]
    timeline:
      - at: now+35m
        note: Power finally back
        set:
          binary_sensor.grid: "on"
          sensor.next_restore: unknown
          sensor.next_outage: now+4h
        expect: [Світло є, Відключення]

  - id: off-no-restore-time
    title: No power, schedule has no restore time
    description: Off with no outage in the schedule, so it is unscheduled and the restore time is unknown.
    entities:
      binary_sensor.grid: { state: "off", changed: now-15m }
      sensor.next_outage: unknown
      sensor.next_restore: unknown
    expect: [Немає світла, поза графіком, Світло буде, час невідомий, "!Відключень не заплановано"]
    timeline:
      - at: now+40m
        note: Grid operator posts a restore time
        set:
          sensor.next_restore: now+2h
        expect: [за графіком, Світло буде, через 1 г 20 хв]

  - id: nothing-planned
    title: No outages planned
    entities:
      binary_sensor.grid: { state: "on", changed: now-2d5h }
      sensor.next_outage: unknown
      sensor.next_restore: unknown
    expect: [Світло є, Відключень не заплановано]

  - id: schedule-down
    title: Schedule unavailable
    description: The schedule integration is down; the power state still shows.
    entities:
      binary_sensor.grid: { state: "on", changed: now-40m }
      sensor.next_outage: unavailable
      sensor.next_restore: unavailable
    expect: [Світло є, Графік недоступний]

  - id: off-schedule-down
    title: No power, schedule unavailable
    description: Off while the schedule integration is down, so the reason is unknown.
    entities:
      binary_sensor.grid: { state: "off", changed: now-25m }
      sensor.next_outage: unavailable
      sensor.next_restore: unavailable
    expect: [Немає світла, причина невідома, Графік недоступний]

  - id: grid-unknown
    title: Power sensor unavailable
    entities:
      binary_sensor.grid: unavailable
      sensor.next_outage: now+3h
      sensor.next_restore: unknown
    expect: [Стан мережі невідомий]

  - id: combined-emergency
    title: Combined sensor, emergency outage
    description: One sensor holding kind|time, as a template sensor can build it.
    config:
      next_outage: null
      next_restore: null
      schedule: sensor.next_power_event
    entities:
      binary_sensor.grid: { state: "off", changed: now-30m }
      sensor.next_power_event: emergency
    expect: [Немає світла, вже 30 хв, екстрене, Світло буде, час невідомий, "!Екстрене відключення"]
    timeline:
      - at: now+50m
        note: Grid operator posts a restore time
        set:
          sensor.next_power_event: restore|{now+1h50m}
        expect: [за графіком, Світло буде, через 1 г 00 хв, "20:10"]
      - at: now+1h50m
        note: Power back
        set:
          binary_sensor.grid: "on"
          sensor.next_power_event: clear
        expect: [Світло є, Відключень не заплановано]

  - id: combined-contradictions
    title: Combined sensor out of step with the power
    description: The schedule sensor says "clear" while the power is off, then "restore" while it is on. The card follows the power.
    config:
      next_outage: null
      next_restore: null
      schedule: sensor.next_power_event
    entities:
      binary_sensor.grid: { state: "off", changed: now-10m }
      sensor.next_power_event: clear
    expect: [Немає світла, поза графіком, Світло буде, час невідомий, "!Відключень не заплановано"]
    timeline:
      - at: now+30m
        note: Power back ahead of the schedule
        set:
          binary_sensor.grid: "on"
          sensor.next_power_event: restore|{now+2h}
        expect: [Світло є, Наступне відключення невідоме, "!Світло буде"]

  - id: english-inverted
    title: English, inverted sensor, own colours
    description: An outage sensor that is "on" during an outage, with invert, custom colours and a lower card.
    language: en
    theme: light
    config:
      entity: binary_sensor.power_outage
      invert: true
      height: 130
      colors: { on: "#2e7d32", warn: "#ef6c00" }
    entities:
      binary_sensor.power_outage: { state: "off", changed: now-6h12m }
      sensor.next_outage: now+25m
      sensor.next_restore: unknown
    expect: [Power is on, for 6 h 12 min, Outage, in 25 min]
    timeline:
      - at: now+25m
        note: Outage starts
        set:
          binary_sensor.power_outage: "on"
          sensor.next_outage: unknown
          sensor.next_restore: now+4h25m
        expect: [No power, scheduled, Power back, in 4 h 00 min]

  - id: no-schedule
    title: Power only, no schedule configured
    config:
      next_outage: null
      next_restore: null
    entities:
      binary_sensor.grid: { state: "on", changed: now-2h }
    expect: [Світло є, вже 2 г 00 хв, "!Далі"]

  - id: icons-off
    title: Icons hidden
    description: show_now_icon and show_next_icon set to false.
    config:
      show_now_icon: false
      show_next_icon: false
    entities:
      binary_sensor.grid: { state: "on", changed: now-1h04m }
      sensor.next_outage: now+1h40m
      sensor.next_restore: unknown
    timeline:
      - at: now+1h40m
        note: Outage starts
        set:
          binary_sensor.grid: "off"
          sensor.next_outage: unknown
          sensor.next_restore: now+4h

  - id: custom-icons
    title: Own icons (mdi)
    description: Any state's icon replaced with an mdi icon; the rest keep the built-in ones.
    config:
      icons:
        power_on: mdi:home-lightning-bolt
        power_planned: mdi:home-off
        outage: mdi:transmission-tower-off
        restore: mdi:transmission-tower
    entities:
      binary_sensor.grid: { state: "on", changed: now-25m }
      sensor.next_outage: now+50m
      sensor.next_restore: unknown
    timeline:
      - at: now+50m
        note: Outage starts
        set:
          binary_sensor.grid: "off"
          sensor.next_outage: unknown
          sensor.next_restore: now+3h50m

  - id: horizontal
    title: Side by side (layout horizontal)
    description: Now on the left, next on the right; long titles wrap to two lines.
    config:
      layout: horizontal
    entities:
      binary_sensor.grid: { state: "on", changed: now-1h04m }
      sensor.next_outage: now+1h40m
      sensor.next_restore: unknown
    timeline:
      - at: now+1h40m
        note: Outage starts
        set:
          binary_sensor.grid: "off"
          sensor.next_outage: unknown
          sensor.next_restore: now+29h40m
        expect: [за графіком, Світло буде]
      - at: now+3h
        note: Schedule goes down
        set:
          sensor.next_restore: unavailable
        expect: [Немає світла, Графік недоступний]
      - at: now+4h
        note: Power back, nothing planned
        set:
          binary_sensor.grid: "on"
          sensor.next_outage: unknown
          sensor.next_restore: unknown
        expect: [Світло є, Відключень не заплановано]

  - id: horizontal-unknown
    title: Side by side, power sensor unavailable
    config:
      layout: horizontal
    entities:
      binary_sensor.grid: unavailable
      sensor.next_outage: now+3h
      sensor.next_restore: unknown

  - id: align-center
    title: Text centred (align center)
    config:
      align: center
    entities:
      binary_sensor.grid: { state: "on", changed: now-1h04m }
      sensor.next_outage: now+1h40m
      sensor.next_restore: unknown
    timeline:
      - at: now+1h40m
        note: Outage starts
        set:
          binary_sensor.grid: "off"
          sensor.next_outage: unknown
          sensor.next_restore: now+4h
        expect: [за графіком, Світло буде]

  - id: tall-right-center
    title: Taller card, right-aligned, centred vertically
    description: height 220 gives each half room; valign center puts each block in the middle of its half.
    config:
      height: 220
      align: right
      valign: center
    entities:
      binary_sensor.grid: { state: "off", changed: now-20m }
      sensor.next_outage: unknown
      sensor.next_restore: now+2h40m
    expect: [Немає світла, за графіком, Світло буде, "21:00"]

  - id: seam-icon
    title: Next icon in the centre (seam_icon next)
    description: The next state's icon replaces the arrow; the bottom half drops its own icon.
    config:
      seam_icon: next
    entities:
      binary_sensor.grid: { state: "on", changed: now-1h04m }
      sensor.next_outage: now+1h40m
      sensor.next_restore: unknown
    timeline:
      - at: now+1h40m
        note: Outage starts
        set:
          binary_sensor.grid: "off"
          sensor.next_outage: unknown
          sensor.next_restore: now+4h
      - at: now+5h40m
        note: Power back, nothing planned
        set:
          binary_sensor.grid: "on"
          sensor.next_restore: unknown

  - id: horizontal-centered
    title: Side by side, centred, next icon in the centre
    config:
      layout: horizontal
      align: center
      valign: center
      seam_icon: next
    entities:
      binary_sensor.grid: { state: "off", changed: now-50m }
      sensor.next_outage: unknown
      sensor.next_restore: now+3h10m
    expect: [Немає світла, за графіком, Світло буде]
    timeline:
      - at: now+3h10m
        note: Power back
        set:
          binary_sensor.grid: "on"
          sensor.next_outage: now+8h
          sensor.next_restore: unknown
        expect: [Світло є, Відключення]

  - id: horizontal-bottom-right
    title: Side by side, right-aligned at the bottom
    config:
      layout: horizontal
      align: right
      valign: bottom
    entities:
      binary_sensor.grid: { state: "on", changed: now-3h }
      sensor.next_outage: now+45m
      sensor.next_restore: unknown

  - id: gradient
    title: Gradient tint (gradient true)
    description: Each half fades from its outer edge toward the seam instead of a flat tint.
    config:
      gradient: true
    entities:
      binary_sensor.grid: { state: "on", changed: now-1h04m }
      sensor.next_outage: now+1h40m
      sensor.next_restore: unknown
    timeline:
      - at: now+1h40m
        note: Outage starts
        set:
          binary_sensor.grid: "off"
          sensor.next_outage: unknown
          sensor.next_restore: now+4h
        expect: [за графіком, Світло буде]

  - id: gradient-horizontal
    title: Gradient, side by side, centred icon
    config:
      gradient: true
      layout: horizontal
      seam_icon: next
    entities:
      binary_sensor.grid: { state: "off", changed: now-15m }
      sensor.next_outage: unknown
      sensor.next_restore: unknown
    expect: [Немає світла, поза графіком, час невідомий]
